<header class="navigation" role="banner">
  <div class="navigation-wrapper">
    <a href="{{ site.baseurl }}/" class="logo">
      <span>{{ site.title }}</span>
    </a>
    <nav role="navigation">
      <ul class="navigation-menu">
        {% include nav_links.html %}
      </ul>
    </nav>
    <button type="button" class="cmdk-trigger" data-cmdk-open aria-label="Search (press Command-K or slash)">
      <span class="cmdk-trigger-text">Search</span>
      <kbd>⌘K</kbd>
    </button>
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch colour theme">
      <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">☀</span>
      <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>
