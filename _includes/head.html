<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
  {% if site.name %}
  <meta name="author" content="{{ site.name }}">
  <meta name="copyright" content="&copy; {{ site.name }} {{ site.time | date: '%Y' }}">
  {% endif %}

  <meta name="theme-color" content="#0b0b0d">

  <link rel="icon" type="image/svg+xml" href="{{ "/assets/icons/favicon.svg" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/icons/favicon-32x32.png" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/icons/favicon-16x16.png" | prepend: site.baseurl }}">
  <link rel="shortcut icon" href="{{ "/assets/icons/favicon.ico" | prepend: site.baseurl }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/icons/apple-icon-180x180.png" | prepend: site.baseurl }}">

  {% if site.protocols.fb_image %}
  <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  <meta property="og:url" content="{% if page.url %}{{ site.url }}{{ page.url }}{% else %}{{ site.url }}{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:type" content="website" />
  {% endif %}

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  {% if page.math %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        tags: 'none'
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endif %}

  <script>
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      if (!('IntersectionObserver' in window)) return;

      var root = document.documentElement;

      function ready(fn) {
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fn);
        } else {
          fn();
        }
      }

      /* ---- Dependency-free reveal for in-article h2 section markers ---- */
      root.classList.add('js-reveal');
      ready(function () {
        var targets = document.querySelectorAll('.page .post-content > h2, .post .post-content > h2');
        if (!targets.length) return;
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              io.unobserve(entry.target);
            }
          });
        }, { rootMargin: '0px 0px -10% 0px', threshold: 0.05 });
        targets.forEach(function (el) { io.observe(el); });
      });

      /* ---- Spring-based entrance choreography via Motion (motion.dev) ----
         Elements start hidden via the .js-motion CSS rules (no flash); Motion
         then springs them in. If the CDN module can't be reached, the fallback
         drops .js-motion and everything reverts to its visible resting state. */
      root.classList.add('js-motion');
      var revealed = false;
      var fallback = setTimeout(function () {
        revealed = true;
        root.classList.remove('js-motion');
      }, 2500);

      import('https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm').then(function (Motion) {
        clearTimeout(fallback);
        if (revealed) return;
        var animate = Motion.animate, stagger = Motion.stagger, inView = Motion.inView;
        var ease = [0.16, 1, 0.3, 1];

        ready(function () {
          /* 1. Page-load transition: the content column rises + fades in. */
          animate('.page-content', { opacity: [0, 1], y: [16, 0] }, { duration: 0.5, ease: ease })
            .then(function () {
              var pc = document.querySelector('.page-content');
              if (pc) { pc.style.opacity = '1'; pc.style.transform = ''; pc.style.translate = ''; }
            }).catch(function () {});

          /* 2. Home hero choreography (present on the home page only). */
          if (document.querySelector('.hero-flex')) {
            animate('.hero-photo-frame',
              { opacity: [0, 1], y: [28, 0], scale: [0.94, 1] },
              { type: 'spring', visualDuration: 0.7, bounce: 0.35, delay: 0.1 });

            var heroText = document.querySelectorAll('.hero-text .title, .hero-text .subtitle, .hero-stack-label');
            if (heroText.length) {
              animate([].slice.call(heroText),
                { opacity: [0, 1], y: [22, 0] },
                { type: 'spring', visualDuration: 0.6, bounce: 0.3, delay: stagger(0.1, { start: 0.22 }) });
            }

            /* Tech tiles cascade in; afterwards strip the inline transforms
               Motion leaves behind so the CSS :hover lift keeps working
               (inline styles would otherwise win over the :hover rule). */
            animate('.tech-tile',
              { opacity: [0, 1], y: [20, 0], scale: [0.9, 1] },
              { type: 'spring', visualDuration: 0.55, bounce: 0.4, delay: stagger(0.035, { start: 0.45 }) }
            ).then(function () {
              var tiles = document.querySelectorAll('.tech-tile');
              for (var i = 0; i < tiles.length; i++) {
                tiles[i].style.opacity = '1';
                tiles[i].style.transform = '';
                tiles[i].style.translate = '';
                tiles[i].style.scale = '';
              }
            }).catch(function () {});

            /* 3. Post-list items spring in as they scroll into view (one-shot).
               Motion's inView hands the callback an IntersectionObserverEntry,
               not the element — animate the captured `li`, not the arg, or the
               items stay stuck at the .js-motion opacity:0 and vanish. Strip the
               inline styles on completion so nothing is stranded. */
            var items = document.querySelectorAll('.post-list > li');
            for (var j = 0; j < items.length; j++) {
              (function (li, idx) {
                inView(li, function () {
                  animate(li,
                    { opacity: [0, 1], y: [24, 0] },
                    { type: 'spring', visualDuration: 0.6, bounce: 0.28, delay: Math.min(idx, 4) * 0.06 }
                  ).then(function () {
                    li.style.opacity = '1';
                    li.style.transform = '';
                    li.style.translate = '';
                  }).catch(function () {});
                }, { amount: 0.15 });
              })(items[j], j);
            }
          }
        });
      }).catch(function () {
        clearTimeout(fallback);
        revealed = true;
        root.classList.remove('js-motion');
      });
    })();
  </script>
</head>
