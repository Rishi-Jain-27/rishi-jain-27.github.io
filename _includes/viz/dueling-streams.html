<!-- Static SVG of the dueling architecture. A shared feature trunk feeds two
     streams: a value stream (one scalar V(s)) and an advantage stream (one number
     per action A(s,a)), which an aggregation module recombines into Q(s,a) using
     the mean-subtracted form. Contrast with a plain DQN, whose single head emits
     Q(s,a) directly. Theme-matched to the site tokens. Self-contained.
     Usage in a post:  {% raw %}{% include viz/dueling-streams.html %}{% endraw %} -->
<figure class="flow-viz">
  <svg viewBox="0 0 820 300" role="img"
       aria-label="A state s flows into a shared feature extractor with parameters theta. After the trunk the network forks into two streams. The value stream, parameters beta, produces a single scalar V of s. The advantage stream, parameters alpha, produces one number per action, A of s and a. An aggregation module combines them as V of s plus A of s a minus the mean of A over actions, and emits the action values Q of s a. A plain DQN, by contrast, has one head straight off the trunk that emits Q of s a directly.">
    <defs>
      <marker id="dst-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#797a85"/>
      </marker>
      <marker id="dst-arrow-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#d4af7a"/>
      </marker>
      <marker id="dst-arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#ebc999"/>
      </marker>
    </defs>
    <g font-family="ui-monospace, Menlo, monospace">

      <text x="20" y="26" font-size="13" fill="#adadba">Dueling network: one trunk, two streams, recombined into Q</text>

      <!-- state s -->
      <rect x="20" y="128" width="60" height="44" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="50" y="155" font-size="14" fill="#f0f0f5" text-anchor="middle">s</text>

      <!-- shared trunk -->
      <rect x="104" y="122" width="140" height="56" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="174" y="146" font-size="12.5" fill="#f0f0f5" text-anchor="middle">shared features</text>
      <text x="174" y="163" font-size="11" fill="#797a85" text-anchor="middle">conv / fc, θ</text>

      <!-- value stream -->
      <rect x="300" y="60" width="156" height="52" rx="8" fill="#292a36" stroke="#d4af7a"/>
      <text x="378" y="81" font-size="12.5" fill="#f0f0f5" text-anchor="middle">value stream, β</text>
      <text x="378" y="99" font-size="11" fill="#d4af7a" text-anchor="middle">→ V(s), one number</text>

      <!-- advantage stream -->
      <rect x="300" y="188" width="156" height="52" rx="8" fill="#292a36" stroke="#ebc999"/>
      <text x="378" y="209" font-size="12.5" fill="#f0f0f5" text-anchor="middle">advantage stream, α</text>
      <text x="378" y="227" font-size="11" fill="#ebc999" text-anchor="middle">→ A(s,a), one per action</text>

      <!-- aggregation -->
      <rect x="500" y="118" width="196" height="64" rx="8" fill="#23242f" stroke="#363745"/>
      <text x="598" y="143" font-size="12" fill="#adadba" text-anchor="middle">aggregation</text>
      <text x="598" y="164" font-size="12.5" fill="#ebc999" text-anchor="middle">V(s) + (A(s,a) − meanₐ A)</text>

      <!-- Q output -->
      <rect x="724" y="128" width="76" height="44" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="762" y="155" font-size="13.5" fill="#f0f0f5" text-anchor="middle">Q(s,a)</text>

      <g stroke-width="1.7" fill="none">
        <!-- s -> trunk -->
        <line x1="80" y1="150" x2="100" y2="150" stroke="#797a85" marker-end="url(#dst-arrow)"/>
        <!-- trunk -> value stream -->
        <path d="M244 140 C 274 140, 272 86, 296 86" stroke="#d4af7a" marker-end="url(#dst-arrow-gold)"/>
        <!-- trunk -> advantage stream -->
        <path d="M244 160 C 274 160, 272 214, 296 214" stroke="#ebc999" marker-end="url(#dst-arrow-hi)"/>
        <!-- value -> aggregation -->
        <path d="M456 86 C 480 86, 478 140, 496 140" stroke="#d4af7a" marker-end="url(#dst-arrow-gold)"/>
        <!-- advantage -> aggregation -->
        <path d="M456 214 C 480 214, 478 160, 496 160" stroke="#ebc999" marker-end="url(#dst-arrow-hi)"/>
        <!-- aggregation -> Q -->
        <line x1="696" y1="150" x2="720" y2="150" stroke="#797a85" marker-end="url(#dst-arrow)"/>
      </g>

      <text x="174" y="200" font-size="11" fill="#797a85" text-anchor="middle">(a plain DQN stops here:</text>
      <text x="174" y="215" font-size="11" fill="#797a85" text-anchor="middle">one head → Q(s,a))</text>
    </g>
  </svg>
  <figcaption>The trunk is the same convolutional or fully-connected feature extractor a plain DQN already has. The change is everything after it: instead of one head emitting <span class="flow-a">Q(s,a)</span> straight off the features, the network forks into a <span class="flow-a">value stream</span> that produces a single number for how good the state is, and an <span class="flow-a">advantage stream</span> that produces one number per action for how much better or worse that action is than the others here. The aggregation module folds them back into the action values, and the mean subtraction is the part that makes the fold well-posed.</figcaption>
</figure>
