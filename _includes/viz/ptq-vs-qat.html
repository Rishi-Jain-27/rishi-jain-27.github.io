<!-- Static SVG flow diagram contrasting PTQ and QAT.
     Top track (PTQ): train in FP32, finish, then bolt quantization on after a
     small calibration pass. The gold "quantize" block sits to the RIGHT of the
     dashed "training done" wall.
     Bottom track (QAT): the gold "fake-quant" block lives INSIDE the training
     loop, so gradient descent adapts to the rounding noise; the final INT cast
     is just a cheap fold of the learned scales.
     Theme-matched to the site tokens. Self-contained, no dependencies.
     Usage in a post:  {% raw %}{% include viz/ptq-vs-qat.html %}{% endraw %} -->
<figure class="flow-viz">
  <svg viewBox="0 0 900 490" role="img"
       aria-label="Two pipelines. Top, post-training quantization: data, train in FP32 over many epochs, a finished FP32 model, then a dashed boundary marking the end of training, after which a short calibration pass on roughly a hundred samples feeds a quantize-to-INT step. Bottom, quantization-aware training: data feeds a training loop whose forward pass contains a fake-quant step, repeated every step, and the final step only folds the learned scales into INT.">
    <defs>
      <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5a5b6a"/>
      </marker>
      <marker id="flow-arrow-gold" viewBox="0 0 10 10" refX="8" refY="5"
              markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#d4af7a"/>
      </marker>
    </defs>

    <!-- ============ PTQ (top track) ============ -->
    <text x="60" y="40" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="600" fill="#d4af7a">PTQ<tspan font-weight="400" fill="#adadba"> — quantize after training</tspan></text>

    <!-- epochs loop hint over the train box -->
    <text x="246" y="58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#797a85">epochs</text>
    <path d="M228,70 A18,9 0 1 1 264,70" fill="none" stroke="#797a85" stroke-width="1.3" marker-end="url(#flow-arrow)"/>

    <!-- connectors -->
    <line x1="148" y1="100" x2="176" y2="100" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
    <line x1="308" y1="100" x2="336" y2="100" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
    <line x1="464" y1="100" x2="532" y2="100" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
    <line x1="668" y1="100" x2="696" y2="100" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

    <!-- the "training done" wall -->
    <line x1="496" y1="58" x2="496" y2="168" stroke="#d4af7a" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
    <text x="496" y="180" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#d4af7a">training done</text>

    <!-- boxes -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f0f0f5" text-anchor="middle">
      <rect x="60"  y="74" width="88"  height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="104" y="104">data</text>

      <rect x="180" y="74" width="128" height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="244" y="104">train · FP32</text>

      <rect x="340" y="74" width="124" height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="402" y="104">FP32 model</text>

      <rect x="536" y="74" width="132" height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="602" y="92">calibrate</text>
      <text x="602" y="108" font-size="11" fill="#adadba">~100 samples</text>

      <!-- gold: quantize bolted on AFTER training -->
      <rect class="flow-gold" x="700" y="74" width="150" height="52" rx="8" fill="#d4af7a" fill-opacity="0.12" stroke="#d4af7a" stroke-width="1.6"/>
      <text x="775" y="92" fill="#ebc999">quantize</text>
      <text x="775" y="108" fill="#ebc999">→ INT</text>
    </g>
    <text x="775" y="146" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#797a85">minutes · tiny calib set</text>

    <!-- ============ divider ============ -->
    <line x1="40" y1="235" x2="860" y2="235" stroke="#363745" stroke-width="1" stroke-dasharray="2 6"/>

    <!-- ============ QAT (bottom track) ============ -->
    <text x="60" y="300" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="600" fill="#d4af7a">QAT<tspan font-weight="400" fill="#adadba"> — quantize during training</tspan></text>

    <!-- connectors -->
    <line x1="148" y1="388" x2="176" y2="388" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>
    <line x1="480" y1="388" x2="532" y2="388" stroke="#5a5b6a" stroke-width="1.6" marker-end="url(#flow-arrow)"/>

    <!-- data box -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f0f0f5" text-anchor="middle">
      <rect x="60" y="362" width="88" height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="104" y="392">data</text>
    </g>

    <!-- training-loop container -->
    <rect x="180" y="332" width="300" height="112" rx="10" fill="#292a36" stroke="#363745"/>
    <text x="194" y="352" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#adadba">training loop · FP32</text>

    <!-- pills inside the loop -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
      <rect x="196" y="362" width="82" height="34" rx="7" fill="#1e1f2a" stroke="#363745"/>
      <text x="237" y="383" fill="#f0f0f5">forward</text>

      <!-- gold: fake-quant injected INSIDE the loop -->
      <rect class="flow-gold" x="290" y="362" width="96" height="34" rx="7" fill="#d4af7a" fill-opacity="0.12" stroke="#d4af7a" stroke-width="1.6"/>
      <text x="338" y="383" fill="#ebc999">fake-quant</text>

      <rect x="398" y="362" width="72" height="34" rx="7" fill="#1e1f2a" stroke="#363745"/>
      <text x="434" y="383" fill="#f0f0f5">backward</text>
    </g>

    <!-- loop-back arrow under the pills -->
    <path class="flow-loop" d="M434,398 C434,424 237,424 237,400" fill="none" stroke="#d4af7a" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#flow-arrow-gold)"/>
    <text x="335" y="438" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#d4af7a">every step</text>

    <!-- terminal: the final INT cast is just a fold of learned scales -->
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#f0f0f5" text-anchor="middle">
      <rect x="536" y="362" width="160" height="52" rx="8" fill="#292a36" stroke="#363745"/>
      <text x="616" y="380">fold scales</text>
      <text x="616" y="396">→ INT</text>
    </g>
    <text x="330" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#797a85">full train set · GPU-hours</text>
  </svg>
  <figcaption>Both pipelines start the same and end in an INT model. In <span class="flow-a">PTQ</span> the quantize step is bolted on to the right of the training wall, after the weights are frozen. In <span class="flow-a">QAT</span> the same rounding lives inside the loop as fake-quant, so the weights are trained to absorb the noise and the final cast is only a fold of the learned scales.</figcaption>
</figure>
