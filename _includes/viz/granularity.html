<!-- Static SVG comparing per-tensor, per-channel and per-group quantization on
     the SAME 3x4 matrix used in the post, where 1000.0 sits at row 1, col 1.
     Each panel draws the identical grid but partitions it into a different
     number of scale regions (1, 3, 6). The red wash marks every cell governed
     by a scale that the outlier has blown out, so the eye reads the tradeoff
     directly: more scales (overhead) buys tighter quarantine (quality).
     Theme-matched to the site tokens. Self-contained, no dependencies.
     Usage in a post:  {% raw %}{% include viz/granularity.html %}{% endraw %} -->
<figure class="flow-viz">
  <svg viewBox="0 0 820 252" role="img"
       aria-label="The same three-by-four weight matrix shown three times, with the outlier 1000 at row 1. Per-tensor: a single scale covers all twelve cells, so the outlier blows out the whole matrix. Per-channel: one scale per row, three in total, so the damage is quarantined to the four cells of the middle row. Per-group: each row split into groups of two, six scales in total, so only the two cells in the group holding the outlier are hit.">
    <g font-family="ui-monospace, Menlo, monospace">

      <!-- ===================== panel 1: per-tensor ===================== -->
      <text x="118" y="42" text-anchor="middle" font-size="13" fill="#d4af7a">per-tensor</text>
      <rect x="20" y="70" width="196" height="120" rx="4" fill="#292a36"/>
      <!-- damage: one blown scale ruins the whole matrix -->
      <rect x="20" y="70" width="196" height="120" fill="#e08a7a" fill-opacity="0.20"/>
      <!-- cell separators -->
      <g stroke="#363745" stroke-width="1">
        <line x1="69"  y1="70" x2="69"  y2="190"/>
        <line x1="118" y1="70" x2="118" y2="190"/>
        <line x1="167" y1="70" x2="167" y2="190"/>
        <line x1="20"  y1="110" x2="216" y2="110"/>
        <line x1="20"  y1="150" x2="216" y2="150"/>
      </g>
      <!-- scale region: one box around everything -->
      <rect x="20" y="70" width="196" height="120" rx="4" fill="none" stroke="#d4af7a" stroke-width="2"/>
      <!-- outlier cell -->
      <rect x="69" y="110" width="49" height="40" fill="none" stroke="#ebc999" stroke-width="2"/>
      <g font-size="10" text-anchor="middle" fill="#f0f0f5">
        <text x="44.5"  y="95">1.2</text>  <text x="93.5"  y="95">-0.5</text> <text x="142.5" y="95">2.8</text>  <text x="191.5" y="95">0.9</text>
        <text x="44.5"  y="135">-1.5</text> <text x="93.5"  y="135" fill="#ebc999">1000</text> <text x="142.5" y="135">0.3</text>  <text x="191.5" y="135">-2.1</text>
        <text x="44.5"  y="175">3.1</text>  <text x="93.5"  y="175">-2.2</text> <text x="142.5" y="175">-1.8</text> <text x="191.5" y="175">1.1</text>
      </g>
      <text x="118" y="214" text-anchor="middle" font-size="11" fill="#adadba">1 scale</text>
      <text x="118" y="231" text-anchor="middle" font-size="11" fill="#e08a7a">all 12 cells ruined</text>

      <!-- ===================== panel 2: per-channel ===================== -->
      <text x="410" y="42" text-anchor="middle" font-size="13" fill="#d4af7a">per-channel</text>
      <rect x="312" y="70" width="196" height="120" rx="4" fill="#292a36"/>
      <!-- damage: only the row that holds the outlier -->
      <rect x="312" y="110" width="196" height="40" fill="#e08a7a" fill-opacity="0.20"/>
      <g stroke="#363745" stroke-width="1">
        <line x1="361" y1="70" x2="361" y2="190"/>
        <line x1="410" y1="70" x2="410" y2="190"/>
        <line x1="459" y1="70" x2="459" y2="190"/>
      </g>
      <!-- scale regions: one box per row -->
      <g fill="none" stroke="#d4af7a" stroke-width="2">
        <rect x="312" y="70"  width="196" height="40" rx="4"/>
        <rect x="312" y="110" width="196" height="40" rx="4"/>
        <rect x="312" y="150" width="196" height="40" rx="4"/>
      </g>
      <rect x="361" y="110" width="49" height="40" fill="none" stroke="#ebc999" stroke-width="2"/>
      <g font-size="10" text-anchor="middle" fill="#f0f0f5">
        <text x="336.5" y="95">1.2</text>  <text x="385.5" y="95">-0.5</text> <text x="434.5" y="95">2.8</text>  <text x="483.5" y="95">0.9</text>
        <text x="336.5" y="135">-1.5</text> <text x="385.5" y="135" fill="#ebc999">1000</text> <text x="434.5" y="135">0.3</text>  <text x="483.5" y="135">-2.1</text>
        <text x="336.5" y="175">3.1</text>  <text x="385.5" y="175">-2.2</text> <text x="434.5" y="175">-1.8</text> <text x="483.5" y="175">1.1</text>
      </g>
      <text x="410" y="214" text-anchor="middle" font-size="11" fill="#adadba">3 scales · 1 per row</text>
      <text x="410" y="231" text-anchor="middle" font-size="11" fill="#e08a7a">1 row hit (4 cells)</text>

      <!-- ===================== panel 3: per-group ===================== -->
      <text x="702" y="42" text-anchor="middle" font-size="13" fill="#d4af7a">per-group</text>
      <rect x="604" y="70" width="196" height="120" rx="4" fill="#292a36"/>
      <!-- damage: only the group of 2 that contains the outlier -->
      <rect x="604" y="110" width="98" height="40" fill="#e08a7a" fill-opacity="0.20"/>
      <g stroke="#363745" stroke-width="1">
        <line x1="653" y1="70" x2="653" y2="190"/>
        <line x1="751" y1="70" x2="751" y2="190"/>
      </g>
      <!-- scale regions: groups of 2 columns, two per row -->
      <g fill="none" stroke="#d4af7a" stroke-width="2">
        <rect x="604" y="70"  width="98" height="40" rx="4"/> <rect x="702" y="70"  width="98" height="40" rx="4"/>
        <rect x="604" y="110" width="98" height="40" rx="4"/> <rect x="702" y="110" width="98" height="40" rx="4"/>
        <rect x="604" y="150" width="98" height="40" rx="4"/> <rect x="702" y="150" width="98" height="40" rx="4"/>
      </g>
      <rect x="653" y="110" width="49" height="40" fill="none" stroke="#ebc999" stroke-width="2"/>
      <g font-size="10" text-anchor="middle" fill="#f0f0f5">
        <text x="628.5" y="95">1.2</text>  <text x="677.5" y="95">-0.5</text> <text x="726.5" y="95">2.8</text>  <text x="775.5" y="95">0.9</text>
        <text x="628.5" y="135">-1.5</text> <text x="677.5" y="135" fill="#ebc999">1000</text> <text x="726.5" y="135">0.3</text>  <text x="775.5" y="135">-2.1</text>
        <text x="628.5" y="175">3.1</text>  <text x="677.5" y="175">-2.2</text> <text x="726.5" y="175">-1.8</text> <text x="775.5" y="175">1.1</text>
      </g>
      <text x="702" y="214" text-anchor="middle" font-size="11" fill="#adadba">6 scales · groups of 2</text>
      <text x="702" y="231" text-anchor="middle" font-size="11" fill="#e08a7a">1 group hit (2 cells)</text>

    </g>
  </svg>
  <figcaption>The same matrix three times, with the <span class="flow-a">1000</span> outlier ringed in gold. Each gold box is the territory of one scale, and the red wash is every cell governed by the scale that outlier blew out. Going finer cuts the damage from all twelve cells to four to two, paid for by storing one, then three, then six scale factors.</figcaption>
</figure>
